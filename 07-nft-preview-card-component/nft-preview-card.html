<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT preview card component</title>
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="nft-preview.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <main class="container">

        <div class="card-image-div">
            <a href="#card-image">
                <img class="card-image" src="images/image-equilibrium.jpg" alt="Equilibrium image">

                <div class="overlay">
                    <img src="images/icon-view.svg" alt="">
                </div>
            </a>
        </div>

        <a href="#heading">
            <h1 class="heading">Equilibrium #3429</h1>
        </a>
        <p class="description">Our Equilibrium collection promotes balance and calm.</p>
        <div class="row-div">
            <div class="price-div">
                <img src="images/icon-ethereum.svg" alt="">
                <p class="price">0.041 ETH</p>
            </div>
            <div class="remaining-time-div">
                <img src="images/icon-clock.svg" alt="">
                <p class="remain-time">3 days left</p>
            </div>
        </div>

        <div class="line"></div>
        <div class="creator-div">
            <img class="avatar" src="images/image-avatar.png" alt="">
            <p class="creator-name"><span>Creation of</span><a href="#creator-name"> Jules Wyvern</a></p>
        </div>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor.</a>
        Coded by <a href="#"> mm-code-dev272.</a>
    </footer>
</body>

</html>
