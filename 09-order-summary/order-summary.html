<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary Component</title>
    <link rel="stylesheet" href="order-summary.css">
    <link rel="icon" href="images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="card-div">
        <img class="hero-img" src="images/illustration-hero.svg" alt="">
        <h1 class="order-title">Order Summary</h1>
        <p class="order-description">You can now listen to millions of songs, audiobooks, and podcasts on any
            device anywhere you like!</p>
        <div class="annual-plan">
            <div class="plan-div">
                <img class="plan-icon" src="images/icon-music.svg" alt="">
                <div class="plan-details">
                    <span class="plan-name">Annual Plan</span>
                    <span class="plan-price">$59.99/year</span>
                </div>
            </div>
            <a href="#" class="change-link">Change</a>
        </div>
        <button type="button" class="proceed-btn">Proceed to Payment</button>
        <button type="button" class="cancel-btn">Cancel Order</button>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">mm-code-dev272</a>.
    </footer>
</body>

</html>
