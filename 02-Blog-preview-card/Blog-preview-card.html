<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog preview card</title>
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">
        <img class="card-image" src="images/illustration-article.svg" alt="card image">
        <div class="above-title">
            <p class="badge-text">Learning</p>
            <p class="publish-time">Published 21 Dec 2023</p>
        </div>

        <a class="title-btn" href="#Blog">
            <h1 class="card-title">HTML & CSS foundations</h1>
        </a>
        <p class="card-description">These languages are the backbone of every website, defining structure, content, and
            presentation.</p>

        <div class="card-author-div">
            <img class="author-image" src="images/image-avatar.webp" alt="avatar">
            <p class="author-name">Greg Hooper</p>
        </div>



    </main>
</body>

</html>
