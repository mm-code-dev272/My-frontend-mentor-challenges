<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats Preview Card</title>
    <link rel="stylesheet" href="stats-preview-card.css">
    <link rel="icon" href="images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
    <main class="container">
        <div class="image-div">
            <picture>
                <source media="(min-width : 950px)" srcset="images/image-header-desktop.jpg">
                <img src="images/image-header-mobile.jpg" alt="">
            </picture>
            <div class="overlay" aria-hidden="true">
            </div>
        </div>

        <div class="card-divider">
            <div class="heading">
                <h1>Get <span>insights</span> that help your business grow.</h1>
                <p>
                    Discover the benefits of data
                    analytics and make better decisions
                    regarding revenue, customer
                    experience, and overall efficiency.
                </p>
            </div>
            <div class="stats-div">
                <div>
                    <p>10k+</p>
                    <p>companies</p>
                </div>
                <div>
                    <p>314</p>
                    <p>templates</p>
                </div>
                <div>
                    <p>12M+</p>
                    <p>queries</p>
                </div>
            </div>
        </div>

    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">mm-code-dev272</a>.
    </footer>
</body>

</html>
