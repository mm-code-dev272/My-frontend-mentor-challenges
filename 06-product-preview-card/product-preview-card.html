<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card</title>
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">
        <div class="card-image-div">
            <picture>
                <source media="(min-width: 767px)" srcset="images/image-product-desktop.jpg">
                <img class="card-image" src="images/image-product-mobile.jpg" alt="card image">
            </picture>

        </div>
        <div class="info-div">
            <p class="product-quality">Perfume</p>


            <h1 class="heading">Gabrielle Essence Eau De Parfum</h1>

            <p class="description">
                A floral, solar and voluptuous interpretation composed by Olivier Polge,
                Perfumer-Creator for the House of CHANEL.
            </p>
            <div class="price-div">
                <p class="new-price">$149.99</p>
                <p class="old-price">
                    $169.99
                </p>
            </div>
            <button class="btn" type="button">
                <img src="images/icon-cart.svg" alt="cart svg">
                Add to Cart
            </button>
        </div>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">mm-code-dev272</a>.
    </footer>
</body>

</html>
