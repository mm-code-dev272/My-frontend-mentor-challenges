<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile-card.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <title>Profile card component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="container">
        <div class="card-bg-div">
            <img class="card-bg" src="images/bg-pattern-card.svg" alt="">
            <div class="overlay">
                <img class="victor" src="images/image-victor.jpg" alt="">
            </div>
        </div>
        <div class="heading">
            <div class="name">
                <p>Victor Crest</p>
                <p>26</p>
            </div>
            <p class="country">London</p>
        </div>
        <div class="line"></div>
        <dl class="items">
            <div>
                <dt>80K</dt>
                <dd>Followers</dd>
            </div>
            <div>
                <dt>803K</dt>
                <dd>Likes</dd>
            </div>
            <div>
                <dt>1.4K</dt>
                <dd>Photos</dd>
            </div>
        </dl>
    </main>
</body>

</html>
